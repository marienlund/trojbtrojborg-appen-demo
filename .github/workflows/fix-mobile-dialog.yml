name: One-time mobile dialog fix

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-dialog.yml'

permissions:
  contents: write

jobs:
  fix-dialogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch collapsed mobile dialogs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          data = path.read_bytes()
          marker = b'/* Mobile Safari fix: prevent profile/bid dialogs from collapsing */'
          if marker in data:
              raise SystemExit('Dialog fix already present')

          css = b'''\n\n/* Mobile Safari fix: prevent profile/bid dialogs from collapsing */\n@media (max-width: 640px) {\n  #authDialog[open],\n  #bidDialog[open] {\n    display: block !important;\n    position: fixed !important;\n    inset: auto 0 0 0 !important;\n    margin: 0 !important;\n    width: 100% !important;\n    max-width: 100% !important;\n    overflow: hidden !important;\n  }\n\n  #authDialog[open] {\n    height: 88vh !important;\n    height: min(600px, 88dvh) !important;\n    max-height: 88dvh !important;\n  }\n\n  #bidDialog[open] {\n    height: 76vh !important;\n    height: min(440px, 76dvh) !important;\n    max-height: 76dvh !important;\n  }\n\n  #authDialog[open] .dialog-form,\n  #bidDialog[open] .dialog-form {\n    height: 100% !important;\n    max-height: none !important;\n    overflow-y: auto !important;\n    align-content: start !important;\n    -webkit-overflow-scrolling: touch !important;\n  }\n}\n'''

          needle = b'</style>'
          if needle not in data:
              raise SystemExit('Could not find </style> in index.html')

          path.write_bytes(data.replace(needle, css + b'\n</style>', 1))
          PY

      - name: Commit the fix and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-mobile-dialog.yml
          git commit -m 'Fix collapsed profile and bid dialogs on mobile'
          git push
