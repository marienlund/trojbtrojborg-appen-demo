name: Fix Safari dialog form height

on:
  push:
    paths:
      - '.github/workflows/fix-safari-form-height.yml'

permissions:
  contents: write

jobs:
  fix-dialogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Safari dialog form sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* Safari dialog content fix v3 */'
          if marker not in text:
              css = "\n\n/* Safari dialog content fix v3 */\n#authDialog[open],\n#bidDialog[open] {\n  overflow-y: auto !important;\n  -webkit-overflow-scrolling: touch !important;\n}\n\n#authDialog[open] {\n  height: auto !important;\n  min-height: 460px !important;\n}\n\n#bidDialog[open] {\n  height: auto !important;\n  min-height: 340px !important;\n}\n\n#authDialog[open] .dialog-form,\n#bidDialog[open] .dialog-form {\n  display: grid !important;\n  grid-auto-rows: max-content !important;\n  align-content: start !important;\n  height: auto !important;\n  min-height: 0 !important;\n  max-height: none !important;\n  overflow: visible !important;\n}\n"
              if '</style>' not in text:
                  raise SystemExit('No closing style tag found')
              text = text.replace('</style>', css + '\n</style>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-safari-form-height.yml
          git commit -m "Fix Safari clipping dialog form contents"
          git push
